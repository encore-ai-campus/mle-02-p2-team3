[project]
name = "team-project-prototype"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosql>=15.0",
    "fonttools>=4.66.1",
    "kiwipiepy==0.23.2",
    "kiwipiepy-model==0.23.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
    "neo4j>=6.0.0",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.6",
    "pgvector>=0.3.6",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pymupdf>=1.28.2",
    "pypdf[image]>=6.19.0",
    "python-dotenv>=1.2.3",
    "scikit-learn==1.9.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.65.0",
    "supabase>=2.31.0",
    "torchvision>=0.29.1",
    "certifi>=2026.7.22",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/graph_rag_sample", "src/recipe/recipe_recommender"]
